<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Wi-Fi and setup light patterns</title>
  <desc id="desc">Six stylized circuit boards showing solid blue while connecting, pulsing amber in setup mode, pulsing blue while testing, green when connected, red after failure, and bright red while resetting Wi-Fi.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="pcb-leds" fill="currentColor">
      <circle cx="116.5" cy="83" r="2.5"/><circle cx="133.5" cy="83" r="2.5"/><circle cx="150.5" cy="83" r="2.5"/><circle cx="167.5" cy="83" r="2.5"/><circle cx="184.5" cy="83" r="2.5"/><circle cx="201.5" cy="83" r="2.5"/>
      <circle cx="211" cy="69.5" r="2.5"/><circle cx="211" cy="52.5" r="2.5"/><circle cx="211" cy="35.5" r="2.5"/><circle cx="211" cy="18.5" r="2.5"/>
      <circle cx="201.5" cy="5" r="2.5"/><circle cx="184.5" cy="5" r="2.5"/><circle cx="167.5" cy="5" r="2.5"/><circle cx="150.5" cy="5" r="2.5"/><circle cx="133.5" cy="5" r="2.5"/><circle cx="116.5" cy="5" r="2.5"/><circle cx="99.5" cy="5" r="2.5"/><circle cx="82.5" cy="5" r="2.5"/><circle cx="65.5" cy="5" r="2.5"/><circle cx="48.5" cy="5" r="2.5"/><circle cx="31.5" cy="5" r="2.5"/><circle cx="14.5" cy="5" r="2.5"/>
      <circle cx="5" cy="18.5" r="2.5"/><circle cx="5" cy="35.5" r="2.5"/><circle cx="5" cy="52.5" r="2.5"/><circle cx="5" cy="69.5" r="2.5"/>
      <circle cx="14.5" cy="83" r="2.5"/><circle cx="31.5" cy="83" r="2.5"/><circle cx="48.5" cy="83" r="2.5"/><circle cx="65.5" cy="83" r="2.5"/><circle cx="82.5" cy="83" r="2.5"/><circle cx="99.5" cy="83" r="2.5"/>
    </g>
    <g id="mini-board">
      <g transform="translate(12 28) scale(1.57044)">
        <rect width="216.5" height="88.5" rx="6.5" fill="#173b31" stroke="#285346" stroke-width="1.3"/>
        <rect x="15" y="15" width="62" height="58.5" rx="3" fill="#0d171f" stroke="#285346" stroke-width="1.3"/>
        <rect x="139" y="15" width="62" height="58.5" rx="3" fill="#0d171f" stroke="#285346" stroke-width="1.3"/>
        <use href="#pcb-leds" color="#697c76" opacity=".42"/>
      </g>
    </g>
    <g id="all-mini-leds" transform="translate(12 28) scale(1.57044)"><use href="#pcb-leds"/></g>
  </defs>
  <rect width="1200" height="850" rx="28" fill="#0d171f"/>
  <text x="55" y="58" fill="#f5f7fa" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Wi-Fi and setup</text>
  <text x="55" y="88" fill="#9dafbd" font-family="system-ui, sans-serif" font-size="17">After the power check, the full LED perimeter reports connection progress.</text>

  <g transform="translate(45 120)"><use href="#mini-board"/><use href="#all-mini-leds" color="#3988ff" filter="url(#glow)"/><text x="12" y="207" fill="#70aaff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Connecting</text><text x="12" y="232" fill="#b9c6cf" font-family="system-ui, sans-serif" font-size="16">Solid blue</text></g>
  <g transform="translate(430 120)"><use href="#mini-board"/><use href="#all-mini-leds" color="#ffad32" filter="url(#glow)" opacity=".74"/><path d="M321 13l9-13m7 20l14-8" stroke="#ffd18a" stroke-width="3" stroke-linecap="round"/><text x="12" y="207" fill="#ffbd57" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Setup portal</text><text x="12" y="232" fill="#b9c6cf" font-family="system-ui, sans-serif" font-size="16">Pulsing amber</text></g>
  <g transform="translate(815 120)"><use href="#mini-board"/><use href="#all-mini-leds" color="#3988ff" filter="url(#glow)" opacity=".74"/><path d="M321 13l9-13m7 20l14-8" stroke="#a9c9ff" stroke-width="3" stroke-linecap="round"/><text x="12" y="207" fill="#70aaff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Testing details</text><text x="12" y="232" fill="#b9c6cf" font-family="system-ui, sans-serif" font-size="16">Pulsing blue</text></g>

  <g transform="translate(45 430)"><use href="#mini-board"/><use href="#all-mini-leds" color="#48df82" filter="url(#glow)"/><path d="M155 97l16 16 38-43" fill="none" stroke="#d4ffe3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="207" fill="#75eb9f" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Connected</text><text x="12" y="232" fill="#b9c6cf" font-family="system-ui, sans-serif" font-size="16">Solid green</text></g>
  <g transform="translate(430 430)"><use href="#mini-board"/><use href="#all-mini-leds" color="#ff4d5e" filter="url(#glow)"/><path d="M165 80l35 35m0-35l-35 35" stroke="#ffd6da" stroke-width="7" stroke-linecap="round"/><text x="12" y="207" fill="#ff7582" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Connection failed</text><text x="12" y="232" fill="#b9c6cf" font-family="system-ui, sans-serif" font-size="16">Solid red</text></g>
  <g transform="translate(815 430)"><use href="#mini-board"/><use href="#all-mini-leds" color="#ff3045" filter="url(#glow)"/><path d="M178 73v31m-13-18l13-13 13 13m-25 30h25" fill="none" stroke="#ffe0e3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="207" fill="#ff6675" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Wi-Fi reset</text><text x="12" y="232" fill="#b9c6cf" font-family="system-ui, sans-serif" font-size="16">Bright red after holding BOOT</text></g>

  <rect x="45" y="733" width="1110" height="72" rx="16" fill="#13242f" stroke="#253d4b"/>
  <text x="75" y="765" fill="#f1f5f8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Tip</text>
  <text x="75" y="790" fill="#aebdc7" font-family="system-ui, sans-serif" font-size="16">Pulsing means the LEDs alternate between bright and dim about three times every two seconds.</text>
</svg>
